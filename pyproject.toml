[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hrl-airsim"
version = "0.1.0"
description = "Hierarchical reinforcement learning framework targeting AirSim"
authors = [{ name = "AirSim HRL Team" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "airsim>=1.8.1",
    "stable-baselines3[extra]>=2.7.0",
    "pydantic==2.7.1",
    "pyyaml==6.0.1",
    "pytest>=8.2.0",
    "numpy>=2.3.3",
    "msgpack-rpc-python>=0.4.1",
    "python-dotenv>=1.1.1",
    "backports-ssl-match-hostname>=3.7.0.1",
    "torch>=2.8.0",
    "ultralytics>=8.2.0",
    "matplotlib>=3.10.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
managed = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
lint.select = [
    "E",
    "F",
    "B",
    "I",
    "C4"
]
lint.ignore = ["E501"]
lint.fixable = ["ALL"]
lint.isort.known-first-party = [
    "airsim_env",
    "hrl_agent",
    "perception",
    "utils",
    "config"
]
lint.isort.combine-as-imports = true

[tool.pytest.ini_options]
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=85"
testpaths = [
    "tests"
]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.2",
]
