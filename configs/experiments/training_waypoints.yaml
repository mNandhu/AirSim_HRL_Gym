# Waypoint-based training configuration for HRL AirSim
# This configuration uses path-following instead of single-goal navigation,
# resolving the reward conflict where agents were punished for following
# curved roads while trying to reach a distant straight-line goal.

scene: Neighbourhood
vehicle: DefaultSedan

start_pose:
    x: 0.0
    y: 0.0
    z: -2.0
    yaw: 0.0

# Waypoint-based path (replaces single goal_pose)
# Agent receives rewards for progressing to the next waypoint on the path,
# not for moving towards a distant final goal. This aligns progress_velocity
# reward with FOLLOW_LANE command shaping.
waypoints:
    - x: 51.5
      y: -0.4
      z: -0.6
      yaw: -2.0

    - x: 117.1
      y: -1.9
      z: -0.6
      yaw: -0.7

    - x: 128.5
      y: 22.8
      z: -0.6
      yaw: 90.1

    - x: 128.2
      y: 110.2
      z: -0.6
      yaw: 90.2

    - x: 108.3
      y: 128.9
      z: -0.6
      yaw: 179.8

    - x: 14.9
      y: 126.8
      z: -0.6
      yaw: 179.2

    - x: 0.8
      y: 97.5
      z: -0.6
      yaw: -90.2

    - x: 0.4
      y: 6.2
      z: -0.6
      yaw: -90.3

horizon: 1000

seeds:
    python: 123
    numpy: 124
    torch: 125
    airsim: 126
    deterministic: true

weather_profile: null
